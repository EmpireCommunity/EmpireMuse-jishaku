name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar o ruff
        run: python -m pip install "ruff>=0.15,<1"

      - name: Verificação estática
        run: ruff check .

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Instalar o pacote com as dependências de teste
        run: python -m pip install -e ".[procinfo]" pytest

      - name: Rodar os testes
        run: python -m pytest -q

  wheel:
    name: Wheel (build e instalação limpa)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Construir a wheel duas vezes e conferir que o hash é o mesmo
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --wheel --no-isolation --outdir dist
          rm -rf build ./*.egg-info
          python -m build --wheel --no-isolation --outdir dist-rebuild
          (cd dist && sha256sum -- *.whl) | tee "$RUNNER_TEMP/primeira.sha"
          (cd dist-rebuild && sha256sum -- *.whl) > "$RUNNER_TEMP/segunda.sha"
          diff "$RUNNER_TEMP/primeira.sha" "$RUNNER_TEMP/segunda.sha"

      - name: Instalar a wheel num ambiente limpo e conferir a versão
        run: |
          python -m venv "$RUNNER_TEMP/limpo"
          "$RUNNER_TEMP/limpo/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/limpo/bin/python" - <<'PY'
          import importlib.metadata

          import disnake.ext.commands as commands
          import jishaku

          instalada = importlib.metadata.version("empiremuse-jishaku")
          assert instalada == jishaku.__version__, (instalada, jishaku.__version__)
          print("empiremuse-jishaku", instalada, "com disnake", importlib.metadata.version("disnake"))
          PY
